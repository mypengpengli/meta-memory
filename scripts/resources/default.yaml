# Internal compatibility defaults for the legacy data plane.
# Ordinary users configure ~/.meta-memory/config.toml through `meta-memory setup`.
hot_memory:
  enabled: true
  frozen_during_session: true
review:
  enabled: true
  every_n_user_turns: 4
retrieval:
  top_k: 8
  enable_embeddings: false
  weights:
    field: 0.30
    document_bm25: 0.15
    chunk_bm25: 0.20
    embedding: 0.20
    entity: 0.10
    graph: 0.05
security:
  scan_memory_writes: true
  scan_prompt_snapshot: true
worker:
  retry_limit: 5
