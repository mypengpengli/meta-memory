interface:
  display_name: "Meta Memory / 记忆编排"
  short_description: "Load only relevant scoped memories, record turns, and conservatively write back durable facts"
  default_prompt: "Use $memory-orchestrator to run scripts/memory_runtime.py before answering, pass a stable subject-id scope, and use only context_markdown as memory context. Record the turn after answering. Long-term memory must come through a sourced, validated consolidation plan; heartbeat only makes session cards, high-risk corrections require review, and deterministic field/BM25/chunk/link retrieval remains the default without embeddings."
