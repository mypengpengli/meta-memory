[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-memory"
version = "2.5.0"
description = "A shared local long-term memory runtime for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Meta Memory contributors"}]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.scripts]
meta-memory = "meta_memory.cli:main"

[tool.setuptools.packages.find]
include = ["meta_memory*", "scripts*", "migrations"]

[tool.setuptools.package-data]
migrations = ["*.sql"]
meta_memory = ["templates/*.template"]
